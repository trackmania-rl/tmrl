[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "tmrl"
version = "0.7.1"
description = "Network-based framework for real-time robot learning"
readme = "readme/pypi.md"
license = "MIT"
authors = [
    { name = "Yann Bouteiller", email = "yann.bouteiller@polymtl.ca" },
    { name = "Edouard Geze", email = "edouard.geze@hotmail.fr" },
    { name = "Jakub Szulc" },
]
keywords = [
    "reinforcement learning",
    "robot learning",
    "trackmania",
    "self driving",
    "roborace",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "chardet",
    "einops>=0.7",
    "gymnasium>=0.29",
    "loguru>=0.7",
    "tyro>=0.8",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "keyboard>=0.13.5",
    "inputs>=0.5",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "opencv-python>=4.5",
    "packaging",
    "pandas>=1.5",
    "plotly>=5.17",
    "PyAutoGUI>=0.9.54",
    "pyinstrument",
    "requests>=2.28",
    "rtgym>=0.12",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "setuptools>=65.5",
    "tlspyo>=0.2.5",
    "torch>=2.4",
    "torchrl>=0.1.1",
    "torchviz>=0.0.2",
    "torchvision>=0.15",
    "wandb>=0.15.8",
    "PyYAML",
    "mss; sys_platform == 'linux'",
    "vgamepad>=0.1.0; sys_platform == 'linux'",
    "pywin32>=303; sys_platform == 'win32'",
    "vgamepad; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest>=7.0",
    "types-requests>=2.31",
]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest>=7.0",
    "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/trackmania-rl/tmrl"
Documentation = "https://tmrl.readthedocs.io"
Repository = "https://github.com/trackmania-rl/tmrl"

[tool.uv]
index-strategy = "unsafe-best-match"
torch-backend = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["tmrl*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py312"
line-length = 200
src = ["tmrl"]
extend-exclude = ["tmrl/tools/init_package/init_pywin32.py"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "PT",
]
ignore = [
    "N999",
    "N812",
    "E402",
    "N802",
    "RUF005",
    "RUF059",
    "SIM108",
    "SIM401",
    "UP031",
    "B904",
    "B008",
    "B007",
    "B026",
    "E721",
    "E722",
    "F401",
    "N801",
    "N803",
    "N806",
    "N818",
    "RUF012",
    "RUF034",
    "SIM105",
    "SIM115",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tlspyo.*", "rtgym.*"]
ignore_missing_imports = true
